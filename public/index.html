function evalExpr(s){var i=0;
  function ws(){while(s[i]===' ')i++}
  function num(){ws();var m=/^[0-9]*\.?[0-9]+(?:[eE][+-]?\d+)?/.exec(s.slice(i));if(!m)throw 0;i+=m[0].length;return parseFloat(m[0])}

  function term(){var v=fac();for(;;){ws();if(s[i]==='*'){i++;v*=fac()}else if(s[i]==='/'){i++;v/=fac()}else return v}}
  function expr(){var v=term();for(;;){ws();if(s[i]==='+'){i++;v+=term()}else if(s[i]==='-'){i++;v-=term()}else return v}}

function workload(weeks){var mon=mondayOf(TODAY()),res={};
  S.tasks.filter(function(t){return t.status!=='Done'}).forEach(function(t){
    var rem=Math.max(t.est-logged(t),0);if(!rem)return;
    var days=[],c=normWD(t.start),g=0;while(c<=t.due&&g<400){days.push(c);c=nextWD(c);g++}
    if(!days.length)days.push(normWD(t.start));
    var per=rem/days.length,k=t.assignee||'';res[k]=res[k]||Array(weeks).fill(0);
    days.forEach(function(dd){var i=Math.max(0,Math.floor(diffD(mon,dd)/7));if(i<weeks)res[k][i]+=per})});
  return {res:res,mon:mon}}
function conflicts(){var f=S.fields.find(function(x){return x.name==='Instrument'});if(!f)return [];var out=[];
  var ts=S.tasks.filter(function(t){return t.status!=='Done'&&t.cf[f.id]&&t.cf[f.id]!=='Other'});
  for(var i=0;i<ts.length;i++)for(var j=i+1;j<ts.length;j++){var a=ts[i],b=ts[j];if(a.cf[f.id]===b.cf[f.id]&&a.start<=b.due&&b.start<=a.due)out.push([a,b,a.cf[f.id]])}
  return out}

  rows.forEach(function(r){

  return html}

function ruleText(r){var t=r.trigger,c=r.cond,a=r.action,pn=function(id){return (P(id)||{}).name||id};
  var T1=t.type==='status_to'?'the status becomes "'+t.value+'"':t.type==='created'?'a task is created':'a task passes its due date';

function valInput(type,val,id){
  if(type==='status_to'||type==='set_status')return '<select id="'+id+'" data-ch="rb" data-f="'+id+'">'+opt(STATUSES,val)+'</select>';

  if(type==='project')return '<select id="'+id+'" data-ch="rb" data-f="'+id+'">'+opt(pOpts(),val)+'</select>';
  if(type==='set_assignee')return '<select id="'+id+'" data-ch="rb" data-f="'+id+'">'+opt(uOpts(),val)+'</select>';

 fpj:function(e){S.ui.fpj=e.value;S.ui.ftk='';save();renderBody()},ftk:function(e){S.ui.ftk=e.value;save();renderBody()},
 openfile:function(e){var f=e.files&&e.files[0];if(!f)return;if(!isAdmin()){toast('Only Admin can import.');e.value='';return}
  if(f.size>5e6){toast('File too large (max 5 MB).');e.value='';return}
  var r=new FileReader();r.onload=function(){var o=null;try{o=JSON.parse(String(r.result))}catch(x){}if(!o||o.v!==1){toast('Invalid file: a LabPM session (v:1) is required.');return}
   var wu=$('#imp-u')&&$('#imp-u').checked;if(MODE==='folder'){var q=foldIn(o,false,wu);syncSchedule();softRender();toast('Imported '+q.n+' records'+(q.bad?', '+q.bad+' skipped':'')+'.');return}api('POST','/api/import'+(wu?'?users=1':''),o).then(function(x){if(x.s===200){toast('Imported '+x.j.imported+' records.');loadState()}else toast(x.j.error||'Import failed')})};
  r.onerror=function(){toast('Unable to read the file.')};r.readAsText(f);e.value=''},
 fp:function(e){S.ui.fp=e.value;save();renderBody()},fa:function(e){S.ui.fa=e.value;save();renderBody()},fs:function(e){S.ui.fs=e.value;save();renderBody()},
 group:function(e){S.ui.group=e.value;save();renderBody()},
 attach:function(e){var l=Array.prototype.slice.call(e.files||[]),t=e.dataset.task||'',pj=e.dataset.proj||'';e.value='';attachFiles(l,t,pj)},
 fpr:function(e){S.ui.fpr=e.value;save();renderBody()},fdf:function(e){S.ui.fdf=e.value;save();renderBody()},fdt:function(e){S.ui.fdt=e.value;save();renderBody()},
 widget:function(e){S.ui.widgets[e.dataset.k]=e.checked?1:0;save();renderBody()},
 ap:function(e){S.ui.ap=e.value;renderBody()},
 pstat:function(e){var p=P(e.dataset.id);if(p&&isPM()){p.status=e.value;save();renderBody()}},
 docf:function(e){var d=S.docs.find(function(x){return x.id===S.ui.doc});if(!d)return;d[e.dataset.f]=e.value;d.updated=Date.now();if(e.dataset.f==='taskId'&&e.value){var t=T(e.value);if(t)d.projectId=t.projectId}save();renderBody()},
 rb:function(e){var f=e.dataset.f,b=S.ui.rb;b[f]=e.value;if(f==='tt')b.tv=defVal('status_to');if(f==='ct')b.cv=defVal(e.value);if(f==='at')b.av=defVal(e.value);if(f==='tt'||f==='ct'||f==='at')renderBody()},
 ruleon:function(e){var r=S.rules.find(function(x){return x.id===e.dataset.id});if(r&&isPM()){r.on=e.checked;save()}},
 uname:function(e){var u=Uu(e.dataset.id);if(u&&isAdmin()&&e.value.trim()){u.name=e.value.trim();save();render()}},
 urole:function(e){var u=Uu(e.dataset.id);if(u&&isAdmin()){u.role=e.value;save();render()}},
 ucap:function(e){var u=Uu(e.dataset.id);if(u&&isAdmin()){u.cap=Math.max(0,parseFloat(e.value)||0);save()}},
 dr:function(e){var t=T(S.ui.drawer);if(!t||!canEdit(t))return;var f=e.dataset.f,v=e.value,msg='';
  if(f==='title'){t.title=v.trim()||t.title}
  else if(f==='project'){t.projectId=v}
  else if(f==='status'){applyStatus(t,v)}
  else if(f==='assignee'){if(isPM())t.assignee=v||null}
  else if(f==='priority'){t.priority=v}
  else if(f==='start'||f==='due'){var s=f==='start'?v:t.start,d=f==='due'?v:t.due;if(!s||!d){}else if(d<s)toast('The due date is before the start date.');else{setDates(t,s,d)}}
  else if(f==='est'){t.est=Math.max(0,parseFloat(v)||0)}
  else if(f==='tags'){t.tags=v.split(',').map(function(x){return x.trim()}).filter(Boolean)}
  else if(f==='notes'){t.notes=v}
  else if(f.indexOf('cf:')===0){var fid=f.slice(3),fl=S.fields.find(function(x){return x.id===fid});t.cf[fid]=e.type==='checkbox'?e.checked:(fl&&fl.type==='number'&&v!==''?parseFloat(v):v)}
  else if(f.indexOf('dep:')===0){var id=f.slice(4);if(e.checked){if(t.deps.indexOf(id)<0)t.deps.push(id);}else t.deps=t.deps.filter(function(x){return x!==id})}
  save();commit()}
};

/* ---------- events ---------- */
document.addEventListener('click',function(ev){var e=ev.target.closest('[data-act]');if(!e)return;var a=A[e.dataset.act];if(a){if(e.tagName==='A')ev.preventDefault();a(e,ev)}});
document.addEventListener('change',function(ev){var e=ev.target.closest('[data-ch]');if(!e)return;var h=H[e.dataset.ch];if(h)h(e)});
document.addEventListener('input',function(ev){var e=ev.target;if(e.matches&&e.matches('[data-in="q"]')){S.ui.q=e.value;$('#tv').innerHTML=tv();var n=$('#xln');if(n)n.textContent=filtered().length;save();return}
  /* autosave every keystroke in free-text fields (state only; no re-render, so focus is kept) */
  var c=e.dataset&&e.dataset.ch,f=e.dataset&&e.dataset.f;
  if(c==='dr'&&f==='notes'){var t=T(S.ui.drawer);if(t&&canEdit(t)){t.notes=e.value;save()}}
  else if(c==='docf'&&(f==='body'||f==='title')){var d=S.docs.find(function(x){return x.id===S.ui.doc});if(d&&(isPM()||role()==='Researcher')){d[f]=e.value;d.updated=Date.now();save()}}});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.ui.drawer)A.close()});
document.addEventListener('dragstart',function(ev){var e=ev.target.closest('[data-drag]');if(e){try{ev.dataTransfer.setData('text/plain',e.dataset.drag);ev.dataTransfer.effectAllowed='move'}catch(x){}}});
document.addEventListener('dragover',function(ev){var c=ev.target.closest('[data-drop]');if(c){ev.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',function(ev){var c=ev.target.closest('[data-drop]');if(c)c.classList.remove('over')});
document.addEventListener('drop',function(ev){var c=ev.target.closest('[data-drop]');if(!c)return;ev.preventDefault();c.classList.remove('over');var id=ev.dataTransfer.getData('text/plain'),t=T(id);if(!t)return;if(!canEdit(t)){toast('Your role cannot edit this task.');return}if(applyStatus(t,c.dataset.drop))save();renderBody()});

boot();
setInterval(function(){folderSweep()},60000);
setInterval(function(){if(!S)return;var t=S.tasks.find(function(x){return x.timer&&x.timer.user===S.me}),b=$('#tbt');if(t&&b)b.textContent=elapsed(t)},1000);

})();
