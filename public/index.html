<style>

.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}

.dr{background:var(--surface);width:min(560px,100%);height:100%;overflow-y:auto;padding:16px;padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}

.md h3,.md h4,.md h5{margin:10px 0 4px}.md p{margin:4px 0}.md code{font-family:var(--f-m);background:var(--surface2);padding:0 4px;border-radius:3px}

.dl{display:flex;flex-direction:column;gap:4px}

@media (max-width:860px){
 .ng,.sess{display:none}

}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>

/* ---------- date utilities ---------- */

  var v=S.ui.view,titles={};NAVFLAT.forEach(function(n){titles[n[0]]=n[1]});

  var nav=NAV.map(function(g){return '<div class="ng">'+g[0]+'</div>'+g[1].map(function(n){return '<button class="nv" data-act="nav" data-v="'+n[0]+'"'+(v===n[0]?' aria-current="page"':'')+'>'+n[1]+'</button>'}).join('')}).join('');
  var th=[['light','Light'],['dark','Dark'],['auto','Auto']].map(function(x){return '<button data-act="theme" data-v="'+x[0]+'" aria-pressed="'+(S.ui.theme===x[0])+'">'+x[1]+'</button>'}).join('');
  $('#app').innerHTML='<div class="app"><nav class="side" aria-label="Sections"><div class="brand">LabPM<small>v1.3 · chemical laboratory</small></div>'+nav+
    '<div class="sess"><div class="small muted" id="sv">'+esc(savedText())+'</div><button class="btn sm" data-act="nav" data-v="session">Save or open session</button></div></nav>'+
    '<main class="main"><header class="top"><div><h1>'+esc(titles[v])+'</h1><p class="sub">'+esc(DESC[v]||'')+'</p></div><div class="topr">'+
    (rt?'<button class="btn tmr" id="tb" data-act="open" data-id="'+rt.id+'"><span class="rec"></span><span id="tbt">'+elapsed(rt)+'</span></button>':'')+
    '<div class="seg" role="group" aria-label="Theme">'+th+'</div>'+
    '<label class="who">User <select data-ch="me">'+opt(S.users.map(function(u){return [u.id,u.name+' · '+u.role]}),S.me)+'</select></label></div></header>'+
    '<div id="vb">'+body()+'</div>'+
    '<footer class="foot">© 2026 Flavio Pendolino | <a href="https://polyformproject.org/licenses/noncommercial/1.0.0" target="_blank" rel="noopener">PolyForm Noncommercial 1.0.0</a> · LabPM v1.3 · data stays in this browser until you save the session to a file</footer></main></div>'}
function renderBody(){var e=$('#vb');if(e)e.innerHTML=body()}
function commit(){save();renderBody();renderDrawer();var tb=$('#tb');if(!tb&&S.tasks.some(function(t){return t.timer&&t.timer.user===S.me})||tb&&!S.tasks.some(function(t){return t.timer&&t.timer.user===S.me}))render()}
function body(){switch(S.ui.view){case 'dashboard':return vDash();case 'portfolio':return vPort();case 'tasks':return vTasks();case 'requests':return vReq();case 'files':return vFiles();case 'docs':return vDocs();case 'automations':return vAuto();case 'templates':return vTpl();case 'session':return vSession();case 'settings':return vSet();default:return vInfo()}}

/* ---------- dashboard ---------- */
function wKpi(){var op=S.tasks.filter(function(t){return t.status!=='Done'}),ov=op.filter(isOver).length,bl=op.filter(isBlocked).length;
  var est=op.reduce(function(a,t){return a+t.est},0),lg=op.reduce(function(a,t){return a+logged(t)},0),risk=S.projects.filter(function(p){return pHealth(p)==='At risk'}).length;
  var k=function(v,l){return '<div><b>'+v+'</b><span>'+l+'</span></div>'};
  return '<section class="card full"><div class="kpis">'+k(op.length,'open tasks')+k(ov,'overdue')+k(bl,'blocked by dependencies')+k(nf(lg)+' / '+nf(est)+' h','hours logged / estimated (open)')+k(risk,'projects at risk')+k(conflicts().length,'instrument conflicts')+'</div></section>'}
function wStatus(){var mx=Math.max(1,Math.max.apply(null,STATUSES.map(function(s){return S.tasks.filter(function(t){return t.status===s}).length})));
  return '<section class="card"><h2>Task status</h2><div class="lst">'+STATUSES.map(function(s){var n=S.tasks.filter(function(t){return t.status===s}).length;return '<div><span style="min-width:110px">'+st(s)+'</span><span class="grow" style="flex:1"><div class="bar"><i style="width:'+(100*n/mx)+'%;background:var('+SCOL[s]+')"></i></div></span><span class="mono">'+n+'</span></div>'}).join('')+'</div></section>'}
function wHours(){var rows=S.projects.map(function(p){var ts=S.tasks.filter(function(t){return t.projectId===p.id});return {p:p,e:ts.reduce(function(a,t){return a+t.est},0),l:ts.reduce(function(a,t){return a+logged(t)},0)}});
  var mx=Math.max(1,Math.max.apply(null,rows.map(function(r){return Math.max(r.e,r.l)})));
  return '<section class="card"><h2>Hours per project</h2><div class="lst">'+rows.map(function(r){return '<div style="display:block"><div class="small">'+pdot(r.p)+esc(r.p.name)+' <span class="mono muted">'+nf(r.l)+' / '+nf(r.e)+' h</span></div><div class="bar" style="margin:3px 0"><i style="width:'+(100*r.e/mx)+'%;background:var(--line)"></i></div><div class="bar"><i style="width:'+(100*r.l/mx)+'%"></i></div></div>'}).join('')+'</div><p class="small muted" style="margin:8px 0 0">Grey bar: estimated hours. Coloured bar: logged hours.</p></section>'}
function wLoad(){var w=workload(6);var rows=S.users.map(function(u){return [u.name,u.cap,w.res[u.id]||Array(6).fill(0)]});
  return '<section class="card"><h2>Workload, next 6 weeks</h2><div class="lst">'+rows.map(function(r){return '<div><span style="min-width:90px">'+esc(r[0])+'</span><span class="row" style="gap:3px;flex:1">'+r[2].map(function(h){var q=h/r[1];return '<span class="grow" title="'+nf(h)+' h of '+r[1]+' h"><div class="bar '+(q>1?'b':q>.85?'w':'g')+'"><i style="width:'+Math.min(100,100*q)+'%"></i></div></span>'}).join('')+'</span></div>'}).join('')+'</div><p class="small muted" style="margin:8px 0 0">Each bar is one week starting from the current one; red above capacity.</p></section>'}
function wUp(){var ts=S.tasks.filter(function(t){return t.status!=='Done'&&t.due<=addD(TODAY(),7)}).sort(function(a,b){return a.due<b.due?-1:1}).slice(0,8);
  return '<section class="card"><h2>Deadlines within 7 days</h2>'+(ts.length?'<div class="lst">'+ts.map(function(t){return '<div><button class="btn sm" data-act="open" data-id="'+t.id+'">'+fd(t.due)+'</button><span class="grow" style="flex:1">'+esc(t.title)+flags(t)+'</span><span class="small muted">'+esc(uname(t.assignee))+'</span></div>'}).join('')+'</div>':'<p class="muted">No imminent deadlines.</p>')+'</section>'}
function wConf(){var c=conflicts();return '<section class="card"><h2>Instrument conflicts</h2>'+(c.length?'<div class="lst">'+c.map(function(x){return '<div><span><span class="tag">'+esc(x[2])+'</span> '+esc(x[0].title)+' ↔ '+esc(x[1].title)+'</span><button class="btn sm" data-act="open" data-id="'+x[0].id+'">Open</button></div>'}).join('')+'</div>':'<p class="muted">No overlaps on the same instrument.</p>')+'<p class="small muted" style="margin:8px 0 0">Computed from the "Instrument" field on tasks that are not done.</p></section>'}
function summary(pid){var p=P(pid);if(!p)return [];var ts=S.tasks.filter(function(t){return t.projectId===pid}),op=ts.filter(function(t){return t.status!=='Done'});
  var out=['Progress '+pProgress(pid)+'% ('+(ts.length-op.length)+' of '+ts.length+' tasks done).'];
  var ov=op.filter(isOver);out.push(ov.length?'Overdue: '+ov.map(function(t){return t.title+' (due '+fd(t.due)+')'}).join('; ')+'.':'No overdue tasks.');
  var bl=op.filter(isBlocked);if(bl.length)out.push('Blocked: '+bl.map(function(t){return t.title+' ← '+blockers(t).map(function(b){return b.title}).join(', ')}).join('; ')+'.');
  var crit=ov.filter(function(t){return S.tasks.some(function(x){return x.deps.indexOf(t.id)>=0&&x.status!=='Done'})});if(crit.length)out.push('Delays blocking other tasks: '+crit.map(function(t){return t.title}).join('; ')+'.');
  var nx=op.filter(function(t){return !isBlocked(t)}).sort(function(a,b){return a.due<b.due?-1:1})[0];if(nx)out.push('Next unblocked task by due date: '+nx.title+' ('+fd(nx.due)+').');
  var e=ts.reduce(function(a,t){return a+t.est},0),l=ts.reduce(function(a,t){return a+logged(t)},0);out.push('Hours logged '+nf(l)+' of '+nf(e)+' estimated.');return out}
function wAssist(){var pid=S.ui.ap||(S.projects[0]&&S.projects[0].id);
  return '<section class="card"><h2>Project summary</h2><div class="tools"><select data-ch="ap">'+opt(pOpts(),pid)+'</select></div><ul>'+summary(pid).map(function(l){return '<li>'+esc(l)+'</li>'}).join('')+'</ul><p class="small muted" style="margin:0">Generated by fixed rules on task data, without generative AI.</p></section>'}
function vDash(){var W=S.ui.widgets,fn={kpi:wKpi,status:wStatus,hours:wHours,load:wLoad,upcoming:wUp,conflicts:wConf,assistant:wAssist};
  return '<details class="wcfg"><summary>Visible widgets</summary>'+Object.keys(WN).map(function(k){return '<label><input type="checkbox" data-ch="widget" data-k="'+k+'"'+(W[k]?' checked':'')+'> '+WN[k]+'</label>'}).join('')+'</details><div class="wgrid">'+Object.keys(WN).filter(function(k){return W[k]}).map(function(k){return fn[k]()}).join('')+'</div>'}

/* ---------- portfolio and goals ---------- */
function vPort(){
  var rows=S.projects.map(function(p){var ts=S.tasks.filter(function(t){return t.projectId===p.id}),h=pHealth(p),pg=pProgress(p.id);
    var s=ts.map(function(t){return t.start}).sort()[0],d=ts.map(function(t){return t.due}).sort().slice(-1)[0];
    return '<tr><td>'+pdot(p)+'<b>'+esc(p.name)+'</b></td><td><select data-ch="pstat" data-id="'+p.id+'"'+(isPM()?'':' disabled')+'>'+opt([['auto','Auto: '+(pHealth(Object.assign({},p,{status:'auto'})))],'On track','At risk','On hold','Done'],p.status||'auto')+'</select></td><td style="min-width:130px"><div class="bar'+(h==='At risk'?' b':'')+'"><i style="width:'+pg+'%"></i></div><span class="small mono">'+pg+'%</span></td><td class="mono small">'+fd(s)+' → '+fd(d)+'</td><td class="mono">'+ts.filter(function(t){return t.status!=='Done'}).length+' open, '+ts.filter(isOver).length+' overdue</td><td class="mono">'+nf(ts.reduce(function(a,t){return a+logged(t)},0))+' / '+nf(ts.reduce(function(a,t){return a+t.est},0))+' h</td><td><button class="btn sm" data-act="projdoc" data-id="'+p.id+'">Notes</button></td></tr>'}).join('');
  var goals=S.goals.map(function(g){var pg=g.pids.length?Math.round(g.pids.reduce(function(a,id){return a+pProgress(id)},0)/g.pids.length):0,late=g.target<TODAY()&&pg<100;
    return '<div style="display:block"><div class="row"><b class="grow">'+esc(g.name)+'</b><span class="small mono">by '+fd(g.target)+'</span>'+(late?'<span class="flag bad">past due</span>':'')+(isPM()?'<button class="btn sm dng" data-act="goaldel" data-id="'+g.id+'">Remove</button>':'')+'</div><div class="small muted">'+g.pids.map(function(id){return esc((P(id)||{}).name)}).join(', ')+'</div><div class="bar" style="margin-top:4px"><i style="width:'+pg+'%"></i></div><span class="small mono">'+pg+'%</span></div>'}).join('');
  return '<div class="tbw"><table class="tbl"><thead><tr><th>Project</th><th>Status</th><th>Progress</th><th>Period</th><th>Tasks</th><th>Hours</th><th></th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
   (isPM()?'<section class="card"><h2>New project</h2><div class="tools"><input id="np-name" placeholder="Project name" style="flex:1;min-width:200px"><button class="btn pri" data-act="projadd">Add</button></div></section>':'')+
   '<section class="card"><h2>Goals</h2><div class="lst">'+(goals||'<p class="muted">No goals.</p>')+'</div>'+
   (isPM()?'<div class="form" style="margin-top:12px"><label>Goal<input id="ng-name" placeholder="E.g. Validate the FTIR method"></label><label>Due date<input type="date" id="ng-date" value="'+addD(TODAY(),30)+'"></label><label>Linked projects<select id="ng-p" multiple size="3">'+opt(pOpts())+'</select></label><label class="full"><button class="btn pri" data-act="goaladd" style="width:max-content">Add goal</button></label></div>':'')+'<p class="small muted" style="margin:10px 0 0">Progress is the average of the linked projects, weighted by task estimated hours.</p></section>'}

/* ---------- tasks: toolbar and views ---------- */
function filtered(){var q=S.ui.q.toLowerCase();return S.tasks.filter(function(t){return (!S.ui.fp||t.projectId===S.ui.fp)&&(!S.ui.fa||(S.ui.fa==='_'?!t.assignee:t.assignee===S.ui.fa))&&(!S.ui.fs||t.status===S.ui.fs)&&(!S.ui.fpr||t.priority===S.ui.fpr)&&(!S.ui.fdf||t.due>=S.ui.fdf)&&(!S.ui.fdt||t.due<=S.ui.fdt)&&(!q||(t.title+' '+t.tags.join(' ')).toLowerCase().indexOf(q)>=0)})}
function vTasks(){var u=S.ui;
  return '<div class="tools"><div class="seg" role="group" aria-label="View">'+TVIEWS.map(function(v){return '<button data-act="tview" data-v="'+v[0]+'" aria-pressed="'+(u.tview===v[0])+'">'+v[1]+'</button>'}).join('')+'</div>'+
   '<input type="search" id="q" data-in="q" placeholder="Search" value="'+esc(u.q)+'" style="width:150px">'+
   '<select data-ch="fp" aria-label="Project">'+opt([['','All projects']].concat(pOpts()),u.fp)+'</select>'+
   '<select data-ch="fa" aria-label="Assignee">'+opt([['','Everyone'],['_','Unassigned']].concat(S.users.map(function(x){return [x.id,x.name]})),u.fa)+'</select>'+
   '<select data-ch="fs" aria-label="Status">'+opt([['','All statuses']].concat(STATUSES),u.fs)+'</select>'+
   '<select data-ch="fpr" aria-label="Priority">'+opt([['','All priorities']].concat(PRIOS),u.fpr)+'</select>'+
   '<label class="who">Due from <input type="date" data-ch="fdf" value="'+esc(u.fdf)+'"></label><label class="who">to <input type="date" data-ch="fdt" value="'+esc(u.fdt)+'"></label>'+
   (u.q||u.fp||u.fa||u.fs||u.fpr||u.fdf||u.fdt?'<button class="btn" data-act="clearf">Clear filters</button>':'')+
   (u.tview==='list'?'<select data-ch="group" aria-label="Group by">'+opt([['none','No grouping'],['status','By status'],['project','By project'],['assignee','By person'],['priority','By priority']],u.group)+'</select>':'')+
   '<button class="btn" data-act="xlsx" id="xl" title="Exports the tasks matching the filters above">Export Excel (<span id="xln">'+filtered().length+'</span>)</button>'+
   (isPM()?'<button class="btn pri" data-act="newtask">+ Task</button>':'')+'</div><div id="tv">'+tv()+'</div>'}
function tv(){switch(S.ui.tview){case 'board':return vBoard();case 'timeline':return vTL();case 'calendar':return vCal();case 'workload':return vWL();default:return vList()}}
function vList(){var ts=filtered(),g=S.ui.group,cols=8+S.fields.length;
  var key={status:function(t){return t.status},project:function(t){return (P(t.projectId)||{}).name||'—'},assignee:function(t){return uname(t.assignee)},priority:function(t){return t.priority}}[g];
  var groups=[['',ts]];
  if(key){var m={};ts.forEach(function(t){var k=key(t);(m[k]=m[k]||[]).push(t)});var ks=Object.keys(m);if(g==='status')ks.sort(function(a,b){return STATUSES.indexOf(a)-STATUSES.indexOf(b)});if(g==='priority')ks.sort(function(a,b){return PRIOS.indexOf(b)-PRIOS.indexOf(a)});groups=ks.map(function(k){return [k,m[k]]})}
  var row=function(t){var p=P(t.projectId);return '<tr data-act="open" data-id="'+t.id+'"><td><b>'+esc(t.title)+'</b>'+flags(t)+(t.tags.length?' '+t.tags.map(function(x){return '<span class="tag">'+esc(x)+'</span>'}).join(' '):'')+'</td><td>'+pdot(p)+esc(p?p.name:'—')+'</td><td>'+st(t.status)+'</td><td>'+esc(uname(t.assignee))+'</td><td>'+pr(t.priority)+'</td><td class="mono">'+fd(t.start)+'</td><td class="mono">'+fd(t.due)+'</td><td class="mono">'+nf(logged(t))+' / '+nf(t.est)+'</td>'+S.fields.map(function(f){return '<td class="mono">'+esc(cfv(t,f))+'</td>'}).join('')+'</tr>'};
  return '<div class="tbw"><table class="tbl"><thead><tr><th>Title</th><th>Project</th><th>Status</th><th>Assignee</th><th>Priority</th><th>Start</th><th>Due</th><th>Hrs log./est.</th>'+S.fields.map(function(f){return '<th>'+esc(f.name)+'</th>'}).join('')+'</tr></thead><tbody>'+
   (ts.length?groups.map(function(gr){return (gr[0]?'<tr class="gh"><td colspan="'+cols+'">'+esc(gr[0])+' <span class="muted mono">'+gr[1].length+'</span></td></tr>':'')+gr[1].map(row).join('')}).join(''):'<tr><td colspan="'+cols+'" class="muted">No tasks match the filters.</td></tr>')+'</tbody></table></div>'}
function vBoard(){var ts=filtered();
  return '<div class="board">'+STATUSES.map(function(s){var c=ts.filter(function(t){return t.status===s});
   return '<div class="col" data-drop="'+s+'"><h3>'+st(s)+'<span class="mono muted">'+c.length+'</span></h3>'+c.map(function(t){var p=P(t.projectId),tool=S.fields[0]&&t.cf[S.fields[0].id];
    return '<button class="kc" draggable="true" data-drag="'+t.id+'" data-act="open" data-id="'+t.id+'"><span class="t">'+esc(t.title)+'</span><span class="m">'+pdot(p)+'<span>'+esc(ini(uname(t.assignee))||'—')+'</span><span class="mono">'+fd(t.due)+'</span>'+(tool?'<span class="tag">'+esc(tool)+'</span>':'')+flags(t)+'</span></button>'}).join('')+'</div>'}).join('')+'</div><p class="small muted">Drag cards between columns (mouse) or change the status from the task detail.</p>'}
function vTL(){var ts=filtered().slice().sort(function(a,b){return a.projectId===b.projectId?(a.start<b.start?-1:1):(S.projects.indexOf(P(a.projectId))-S.projects.indexOf(P(b.projectId)))});
  var CW=24,RH=30,HH=34,LW=210,t0=mondayOf(addD(TODAY(),-7));
  if(ts.length){var mn=ts.map(function(t){return t.start}).sort()[0];if(mn<t0)t0=mondayOf(mn)}
  var end=addD(TODAY(),70);ts.forEach(function(t){if(t.due>end)end=t.due});var days=Math.ceil((diffD(t0,end)+8)/7)*7,W=days*CW;
  var rows=[],lastP=null;ts.forEach(function(t){if(t.projectId!==lastP){rows.push({ph:P(t.projectId)});lastP=t.projectId}rows.push({t:t})});
  var idx={};rows.forEach(function(r,i){if(r.t)idx[r.t.id]=i});
  var wk='';for(var i=0;i<days;i+=7)wk+='<span class="tl-wk" style="left:'+i*CW+'px">'+fd(addD(t0,i))+'</span>';
  var html='<div class="tl"><div class="tl-in" style="--cw:'+CW+'px;width:'+(LW+W)+'px"><div class="tl-row hd"><div class="tl-lab">Task</div><div class="tl-cells" style="width:'+W+'px">'+wk+'</div></div>';
  rows.forEach(function(r){
    if(r.ph){html+='<div class="tl-row ph"><div class="tl-lab">'+pdot(r.ph)+esc(r.ph.name)+'</div><div class="tl-cells" style="width:'+W+'px"></div></div>';return}
    var t=r.t,l=diffD(t0,t.start)*CW,w=(diffD(t.start,t.due)+1)*CW,pg=t.est?Math.min(100,100*logged(t)/t.est):(t.status==='Done'?100:0);
    html+='<div class="tl-row"><div class="tl-lab" data-act="open" data-id="'+t.id+'" title="'+esc(t.title)+'">'+esc(t.title)+'</div><div class="tl-cells" style="width:'+W+'px"><button class="tl-bar" data-act="open" data-id="'+t.id+'" style="left:'+l+'px;width:'+w+'px;--c:var('+SCOL[t.status]+')" aria-label="'+esc(t.title)+'"><i style="width:'+pg+'%"></i><span>'+esc(ini(uname(t.assignee)))+'</span></button></div></div>'});
  var tdx=diffD(t0,TODAY());
  if(tdx>=0&&tdx<days)html+='<div class="tl-today" style="left:'+(LW+tdx*CW+CW/2)+'px;top:'+HH+'px"></div>';
  var paths='';ts.forEach(function(t){t.deps.forEach(function(d){var p=T(d);if(p&&idx[p.id]!=null&&idx[t.id]!=null){
    var x1=(diffD(t0,p.due)+1)*CW,y1=(idx[p.id])*RH+RH/2,x2=diffD(t0,t.start)*CW,y2=(idx[t.id])*RH+RH/2,xm=x1+6;
    paths+='<path d="M'+x1+' '+y1+' H'+xm+' V'+y2+' H'+x2+'" fill="none" style="stroke:var(--muted)" stroke-width="1.2"/><path d="M'+x2+' '+y2+' l-5 -3.5 v7 z" style="fill:var(--muted)"/>'}})});
  html+='<svg class="tl-svg" style="left:'+LW+'px;top:'+HH+'px" width="'+W+'" height="'+rows.length*RH+'">'+paths+'</svg></div></div><p class="small muted">Red line: today. Arrows link the end of the predecessor to the start of the successor; if you move a due date, successors shift in cascade.</p>';
  return html}
function vCal(){var ym=S.ui.cal.split('-').map(Number),first=new Date(ym[0],ym[1]-1,1),off=(first.getDay()+6)%7,gs=addD(iso(first),-off),ts=filtered(),h='';
  ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(function(d){h+='<div class="dh">'+d+'</div>'});
  for(var i=0;i<42;i++){var d=addD(gs,i),c=ts.filter(function(t){return t.due===d});
    h+='<div class="dc'+(d.slice(0,7)!==S.ui.cal?' off':'')+(d===TODAY()?' td':'')+'"><span class="dn">'+Number(d.slice(8))+'</span>'+c.slice(0,3).map(function(t){return '<button class="cch" data-act="open" data-id="'+t.id+'" style="--c:var('+SCOL[t.status]+')">'+esc(t.title)+'</button>'}).join('')+(c.length>3?'<span class="small muted">+'+(c.length-3)+'</span>':'')+'</div>'}
  return '<div class="tools"><button class="btn" data-act="calprev">←</button><b style="min-width:150px;text-align:center;text-transform:capitalize">'+first.toLocaleDateString('en-GB',{month:'long',year:'numeric'})+'</b><button class="btn" data-act="calnext">→</button><button class="btn" data-act="caltoday">Today</button></div><div class="cal">'+h+'</div><p class="small muted">Cards are placed on the due date.</p>'}
function vWL(){var W=6,w=workload(W),hd='<div></div>';
  for(var i=0;i<W;i++)hd+='<div class="c mono">'+fd(addD(w.mon,i*7))+'</div>';

function ruleText(r){var t=r.trigger,c=r.cond,a=r.action,pn=function(id){return (P(id)||{}).name||id};
  var T1=t.type==='status_to'?'the status becomes "'+t.value+'"':t.type==='created'?'a task is created':'a task passes its due date';
  var C1=c.type==='none'?'':c.type==='project'?' and the project is "'+pn(c.value)+'"':c.type==='priority'?' and the priority is "'+c.value+'"':' and it has the tag "'+c.value+'"';
  var A1={set_assignee:'assign to '+uname(a.value),set_priority:'set priority "'+a.value+'"',set_status:'set status "'+a.value+'"',add_tag:'add tag "'+a.value+'"',create_task:'create task "'+a.value+'"',notify:'notify "'+a.value+'"'}[a.type];
  return 'When '+T1+C1+' → '+A1}
function valInput(type,val,id){
  if(type==='status_to'||type==='set_status')return '<select id="'+id+'" data-ch="rb" data-f="'+id+'">'+opt(STATUSES,val)+'</select>';
  if(type==='priority'||type==='set_priority')return '<select id="'+id+'" data-ch="rb" data-f="'+id+'">'+opt(PRIOS,val)+'</select>';
  if(type==='project')return '<select id="'+id+'" data-ch="rb" data-f="'+id+'">'+opt(pOpts(),val)+'</select>';
  if(type==='set_assignee')return '<select id="'+id+'" data-ch="rb" data-f="'+id+'">'+opt(uOpts(),val)+'</select>';
  if(type==='created'||type==='overdue'||type==='none')return '';
  return '<input id="'+id+'" data-ch="rb" data-f="'+id+'" value="'+esc(val)+'" placeholder="value">'}
function vAuto(){var b=S.ui.rb,ed=isPM();
  return '<section class="card"><h2>Active rules</h2><div class="lst">'+(S.rules.map(function(r){return '<div><label class="row"><input type="checkbox" data-ch="ruleon" data-id="'+r.id+'"'+(r.on?' checked':'')+(ed?'':' disabled')+'><span><b>'+esc(r.name)+'</b><br><span class="small muted">'+esc(ruleText(r))+'</span></span></label>'+(ed?'<button class="btn sm dng" data-act="ruledel" data-id="'+r.id+'">Remove</button>':'')+'</div>'}).join('')||'<p class="muted">No rules.</p>')+'</div></section>'+

   (b.tt==='status_to'?'<label>Status<span>'+valInput('status_to',b.tv,'tv')+'</span></label>':'')+
   '<label>Condition<select data-ch="rb" data-f="ct">'+opt([['none','none'],['project','project is…'],['priority','priority is…'],['tag','has the tag…']],b.ct)+'</select></label>'+

    var root=await FS.h.getDirectoryHandle('attachments',{create:true}),dn=attDir(taskId,pid),sub=await root.getDirectoryHandle(dn,{create:true}),n=0;
    for(var i=0;i<list.length;i++){var f=list[i],base=safeName(f.name),nm=base,k=1;
      for(;;){try{await sub.getFileHandle(nm);k++;var dot=base.lastIndexOf('.');nm=dot>0?base.slice(0,dot)+' ('+k+')'+base.slice(dot):base+' ('+k+')'}catch(e){if(e&&e.name==='NotFoundError')break;throw e}}

async function fileGet(rec){var parts=String(rec.path).split('/');

  await attPerm();var d=FS.h;for(var i=0;i<parts.length-1;i++)d=await d.getDirectoryHandle(parts[i]);
  return (await d.getFileHandle(parts[parts.length-1])).getFile()}

 useradd:function(){var n=$('#nu-n').value.trim();if(!n){toast('Enter the name.');return}S.users.push({id:uid('u'),name:n,role:$('#nu-r').value,cap:40});log('New person "'+n+'"');save();renderBody()},
 userdel:function(e){S.tasks.forEach(function(t){if(t.assignee===e.dataset.id)t.assignee=null});S.users=S.users.filter(function(u){return u.id!==e.dataset.id});save();renderBody()},
 copyics:function(){var L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LabPM//EN'],z=function(s){return String(s).replace(/[\\;,]/g,function(c){return '\\'+c})};
  S.tasks.filter(function(t){return t.status!=='Done'}).forEach(function(t){L.push('BEGIN:VEVENT','UID:'+t.id+'@labpm','DTSTAMP:'+iso(new Date()).replace(/-/g,'')+'T000000Z','DTSTART;VALUE=DATE:'+t.due.replace(/-/g,''),'SUMMARY:'+z(t.title+' ('+uname(t.assignee)+')'),'END:VEVENT')});L.push('END:VCALENDAR');download(L.join('\r\n'),'ICS calendar')},
 copyjson:function(){download(JSON.stringify(S),'JSON backup')},
 impjson:function(){if(!isAdmin())return;var o=null;try{o=normSession(JSON.parse($('#jb').value))}catch(x){}if(!o){toast('Invalid JSON: a LabPM session is required.');return}autoSnap();S=o;applyTheme();save();render();renderDrawer();toast('Session imported.')},
 reset:function(){if(!isAdmin())return;if(!S.ui.confirmReset){S.ui.confirmReset=true;renderBody();return}autoSnap();S=seed();applyTheme();save();render();renderDrawer();toast('Sample data restored (automatic copy created).')}
};
var H={
 openfile:function(e){var f=e.files&&e.files[0];if(!f)return;if(!isAdmin()){toast('Only Admin can open a session.');e.value='';return}
  if(f.size>5e6){toast('File too large (max 5 MB).');e.value='';return}
  var r=new FileReader();r.onload=function(){var o=null;try{o=normSession(JSON.parse(String(r.result)))}catch(x){}
   if(!o){toast('Invalid file: a LabPM session is required.');return}autoSnap();S=o;applyTheme();save();render();renderDrawer();toast('Session opened: '+f.name)};
  r.onerror=function(){toast('Unable to read the file.')};r.readAsText(f);e.value=''},
 me:function(e){S.me=e.value;S.ui.drawer=null;save();render();renderDrawer()},
 fp:function(e){S.ui.fp=e.value;save();renderBody()},fa:function(e){S.ui.fa=e.value;save();renderBody()},fs:function(e){S.ui.fs=e.value;save();renderBody()},
 group:function(e){S.ui.group=e.value;save();renderBody()},
 fpj:function(e){S.ui.fpj=e.value;S.ui.ftk='';save();renderBody()},ftk:function(e){S.ui.ftk=e.value;save();renderBody()},ffp:function(e){S.ui.ffp=e.value;save();renderBody()},
 attach:function(e){var l=Array.prototype.slice.call(e.files||[]),t=e.dataset.task||'',pj=e.dataset.proj||'';e.value='';attachFiles(l,t,pj)},
 fpr:function(e){S.ui.fpr=e.value;save();renderBody()},fdf:function(e){S.ui.fdf=e.value;save();renderBody()},fdt:function(e){S.ui.fdt=e.value;save();renderBody()},
 widget:function(e){S.ui.widgets[e.dataset.k]=e.checked?1:0;save();renderBody()},
 ap:function(e){S.ui.ap=e.value;renderBody()},
 pstat:function(e){var p=P(e.dataset.id);if(p&&isPM()){p.status=e.value;save();renderBody()}},
 docf:function(e){var d=S.docs.find(function(x){return x.id===S.ui.doc});if(!d)return;d[e.dataset.f]=e.value;d.updated=Date.now();if(e.dataset.f==='taskId'&&e.value){var t=T(e.value);if(t)d.projectId=t.projectId}save();renderBody()},
 rb:function(e){var f=e.dataset.f,b=S.ui.rb;b[f]=e.value;if(f==='tt')b.tv=defVal('status_to');if(f==='ct')b.cv=defVal(e.value);if(f==='at')b.av=defVal(e.value);if(f==='tt'||f==='ct'||f==='at')renderBody()},
 ruleon:function(e){var r=S.rules.find(function(x){return x.id===e.dataset.id});if(r&&isPM()){r.on=e.checked;save()}},
 uname:function(e){var u=Uu(e.dataset.id);if(u&&isAdmin()&&e.value.trim()){u.name=e.value.trim();save();render()}},
 urole:function(e){var u=Uu(e.dataset.id);if(u&&isAdmin()){u.role=e.value;save();render()}},
 ucap:function(e){var u=Uu(e.dataset.id);if(u&&isAdmin()){u.cap=Math.max(0,parseFloat(e.value)||0);save()}},
 dr:function(e){var t=T(S.ui.drawer);if(!t||!canEdit(t))return;var f=e.dataset.f,v=e.value,msg='';
  if(f==='title'){t.title=v.trim()||t.title}
  else if(f==='project'){t.projectId=v}
  else if(f==='status'){applyStatus(t,v)}
  else if(f==='assignee'){if(isPM())t.assignee=v||null}
  else if(f==='priority'){t.priority=v}
  else if(f==='start'||f==='due'){var s=f==='start'?v:t.start,d=f==='due'?v:t.due;if(!s||!d){}else if(d<s)toast('The due date is before the start date.');else{var m=setDates(t,s,d);if(m)toast(m+' successor tasks shifted in cascade')}}
  else if(f==='est'){t.est=Math.max(0,parseFloat(v)||0)}
  else if(f==='tags'){t.tags=v.split(',').map(function(x){return x.trim()}).filter(Boolean)}
  else if(f==='notes'){t.notes=v}
  else if(f.indexOf('cf:')===0){var fid=f.slice(3),fl=S.fields.find(function(x){return x.id===fid});t.cf[fid]=e.type==='checkbox'?e.checked:(fl&&fl.type==='number'&&v!==''?parseFloat(v):v)}
  else if(f.indexOf('dep:')===0){var id=f.slice(4);if(e.checked){if(t.deps.indexOf(id)<0)t.deps.push(id);var pr=T(id),n=pr?cascadeFrom(pr):0;if(n)toast(n+' tasks shifted in cascade')}else t.deps=t.deps.filter(function(x){return x!==id})}
  save();commit()}
};

/* ---------- events ---------- */
document.addEventListener('click',function(ev){var e=ev.target.closest('[data-act]');if(!e)return;var a=A[e.dataset.act];if(a){if(e.tagName==='A')ev.preventDefault();a(e,ev)}});
document.addEventListener('change',function(ev){var e=ev.target.closest('[data-ch]');if(!e)return;var h=H[e.dataset.ch];if(h)h(e)});
document.addEventListener('input',function(ev){var e=ev.target;if(e.matches&&e.matches('[data-in="q"]')){S.ui.q=e.value;$('#tv').innerHTML=tv();var n=$('#xln');if(n)n.textContent=filtered().length;save();return}
  /* autosave every keystroke in free-text fields (state only; no re-render, so focus is kept) */
  var c=e.dataset&&e.dataset.ch,f=e.dataset&&e.dataset.f;
  if(c==='dr'&&f==='notes'){var t=T(S.ui.drawer);if(t&&canEdit(t)){t.notes=e.value;save()}}
  else if(c==='docf'&&(f==='body'||f==='title')){var d=S.docs.find(function(x){return x.id===S.ui.doc});if(d&&(isPM()||role()==='Researcher')){d[f]=e.value;d.updated=Date.now();save()}}});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&S.ui.drawer)A.close()});
document.addEventListener('dragstart',function(ev){var e=ev.target.closest('[data-drag]');if(e){try{ev.dataTransfer.setData('text/plain',e.dataset.drag);ev.dataTransfer.effectAllowed='move'}catch(x){}}});
document.addEventListener('dragover',function(ev){var c=ev.target.closest('[data-drop]');if(c){ev.preventDefault();c.classList.add('over')}});
document.addEventListener('dragleave',function(ev){var c=ev.target.closest('[data-drop]');if(c)c.classList.remove('over')});
document.addEventListener('drop',function(ev){var c=ev.target.closest('[data-drop]');if(!c)return;ev.preventDefault();c.classList.remove('over');var id=ev.dataTransfer.getData('text/plain'),t=T(id);if(!t)return;if(!canEdit(t)){toast('Your role cannot edit this task.');return}if(applyStatus(t,c.dataset.drop))save();renderBody()});

/* ---------- startup ---------- */
S=load()||seed();
applyTheme();checkOverdue();save();render();renderDrawer();folderInit();
setInterval(function(){var t=S.tasks.find(function(x){return x.timer&&x.timer.user===S.me}),b=$('#tbt');if(t&&b)b.textContent=elapsed(t)},1000);
setInterval(function(){if(checkOverdue()){renderBody()}},60000);
})();
