name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npx --yes playwright@1.48.0 install --with-deps chromium firefox webkit
      - run: npm i --no-save playwright@1.48.0
      - run: npm test
